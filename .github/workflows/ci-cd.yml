name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: cr.yandex
  IMAGE_NAME: scribot-bot

# ⚠️ ВАЖНО: При добавлении новой переменной окружения обновите:
# 1. Тестовые переменные ниже (в двух местах: Run tests и Test migrations)
# 2. env секцию в deploy job (строка ~150) - для деплоя
# 3. envs список в deploy job (строка ~169) - для передачи в SSH
# Подробнее см. docs/CI_CD_VARIABLES.md
#
# Шаблон тестовых переменных (копируйте в оба места тестов):
#   BOT_TOKEN: "test_token"
#   CHANNEL_URL: "https://test.channel.url"
#   FEEDBACK_URL: "https://test.feedback.url"
#   SOS_URL: "https://test.sos.url"
#   ADMIN_ID: "123456789"
#   LLM_TOKEN: "test_llm_token"

jobs:
  lint:
    name: Run Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      
      - name: Run Ruff
        run: |
          ruff check .

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-cyrillic
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements-test.txt
      
      - name: Run tests
        # ⚠️ При добавлении новой переменной: обновите здесь и в Test migrations ниже
        env:
          BOT_TOKEN: "test_token"
          CHANNEL_URL: "https://test.channel.url"
          FEEDBACK_URL: "https://test.feedback.url"
          SOS_URL: "https://test.sos.url"
          ADMIN_ID: "123456789"
          LLM_TOKEN: "test_llm_token"
        run: |
          pytest tests/ -v --tb=short
      
      - name: Test migrations
        # ⚠️ При добавлении новой переменной: обновите здесь и в Run tests выше
        env:
          BOT_TOKEN: "test_token"
          CHANNEL_URL: "https://test.channel.url"
          FEEDBACK_URL: "https://test.feedback.url"
          SOS_URL: "https://test.sos.url"
          ADMIN_ID: "123456789"
          LLM_TOKEN: "test_llm_token"
        run: |
          echo "🧪 Тестируем миграции..."
          pytest tests/test_migrations.py -v --tb=short

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to Yandex Container Registry
        run: |
          echo '${{ secrets.YC_SA_JSON_CREDENTIALS }}' > /tmp/key.json
          cat /tmp/key.json | docker login \
            --username json_key \
            --password-stdin \
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}
          rm /tmp/key.json
      
      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ secrets.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}"
          # Собираем продакшн образ (тесты уже прошли в отдельном job)
          docker build \
            --target production \
            --tag ${IMAGE_TAG}:latest \
            --tag ${IMAGE_TAG}:${{ github.sha }} \
            -f deployment/Dockerfile .
          
          docker push ${IMAGE_TAG}:latest
          docker push ${IMAGE_TAG}:${{ github.sha }}

  deploy:
    name: Deploy to Server
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.YC_INSTANCE_IP }}
          username: ${{ secrets.YC_INSTANCE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deployment/docker-compose.prod.yml,deployment/deploy.sh"
          target: "~/ScribotV2/"
          strip_components: 0
      
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        # ⚠️ При добавлении новой переменной: добавьте её сюда, в envs список ниже, и в x-test-env выше (если нужна для тестов)
        # Подробнее см. docs/CI_CD_VARIABLES.md
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_URL: ${{ secrets.CHANNEL_URL }}
          FEEDBACK_URL: ${{ secrets.FEEDBACK_URL }}
          SOS_URL: ${{ secrets.SOS_URL }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL || 'all' }}
          REQUIRED_CHANNELS: ${{ secrets.REQUIRED_CHANNELS || '' }}
          BASE_PRICE: ${{ secrets.BASE_PRICE || '100' }}
          PROMOTION_TEXT: ${{ secrets.PROMOTION_TEXT || '' }}
          LLM_TOKEN: ${{ secrets.LLM_TOKEN }}
          YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
          YC_SA_JSON_CREDENTIALS: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          NEW_IMAGE: ${{ env.REGISTRY }}/${{ secrets.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:latest
          BACKUP_IMAGE: ${{ env.REGISTRY }}/${{ secrets.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:stable
        with:
          host: ${{ secrets.YC_INSTANCE_IP }}
          username: ${{ secrets.YC_INSTANCE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # ⚠️ Список должен совпадать с именами переменных в env выше (кроме NEW_IMAGE и BACKUP_IMAGE - они вычисляются)
          envs: BOT_TOKEN,CHANNEL_URL,FEEDBACK_URL,SOS_URL,ADMIN_ID,LOG_LEVEL,REQUIRED_CHANNELS,BASE_PRICE,PROMOTION_TEXT,LLM_TOKEN,YC_REGISTRY_ID,YC_SA_JSON_CREDENTIALS,NEW_IMAGE,BACKUP_IMAGE
          script: |
            # Устанавливаем docker compose plugin если нет
            if ! docker compose version &>/dev/null; then
              mkdir -p /usr/local/lib/docker/cli-plugins
              curl -SL "https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-x86_64" \
                -o /usr/local/lib/docker/cli-plugins/docker-compose
              chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
            fi
            if [ ! -d ~/ScribotV2 ]; then
              git clone https://github.com/NikPeg/ScribotV2.git ~/ScribotV2
            else
              git -C ~/ScribotV2 pull origin main
            fi
            cd ~/ScribotV2/deployment
            chmod +x deploy.sh
            ./deploy.sh
      
      - name: Final verification
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.YC_INSTANCE_IP }}
          username: ${{ secrets.YC_INSTANCE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🔍 Финальная проверка..."
            if sudo docker ps --filter name=scribot_bot --filter status=running | grep -q scribot_bot; then
              echo "✅ Бот работает"
              sudo docker ps --filter name=scribot_bot --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
              echo ""
              echo "📝 Последние логи:"
              sudo docker logs scribot_bot --tail=20
              echo ""
              echo "🔄 Проверяем применение миграций..."
              # Проверяем, что в логах есть информация о миграциях
              MIGRATION_LOG=$(sudo docker logs scribot_bot 2>&1 | grep -i "миграция\|migration" | tail -5 || echo "")
              if [ -n "$MIGRATION_LOG" ]; then
                echo "✅ Миграции применены:"
                echo "$MIGRATION_LOG"
              else
                echo "⚠️ Информация о миграциях в логах не найдена (возможно, миграции уже были применены ранее)"
              fi
              # Проверяем, что контейнер запустился без ошибок
              ERROR_COUNT=$(sudo docker logs scribot_bot 2>&1 | grep -i "error\|exception\|traceback" | wc -l || echo "0")
              if [ "$ERROR_COUNT" -gt "0" ]; then
                echo "⚠️ Найдены ошибки в логах:"
                sudo docker logs scribot_bot 2>&1 | grep -i "error\|exception\|traceback" | tail -10
              fi
            else
              echo "❌ ВНИМАНИЕ: Бот не работает!"
              sudo docker logs scribot_bot --tail=50 2>&1 || echo "Логи недоступны"
              exit 1
            fi
